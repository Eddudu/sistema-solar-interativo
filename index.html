<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solar Interativo</title>
    <style>
        /* Configuração da Tela e Fundo Espacial */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #0b1021 0%, #020409 100%);
            font-family: Arial, sans-serif;
            transition: background 3s ease;
        }

        /* Fundo de estrelas cintilantes estáticas */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            transition: opacity 3s ease;
        }

        .bg-star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* --- Buraco Negro Gargantua (Canto Superior Direito) --- */
        #gargantua {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            cursor: pointer;
            z-index: 4000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        #gargantua:hover {
            transform: scale(1.15);
        }

        .gargantua-hole {
            position: absolute;
            width: 35px;
            height: 35px;
            background-color: #000000;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.8), inset 0 0 10px rgba(0, 0, 0, 1);
            z-index: 2;
            pointer-events: none;
        }

        .gargantua-disk {
            position: absolute;
            width: 65px;
            height: 25px;
            background: linear-gradient(90deg, #ff4500, #ff8c00, #fff, #ff8c00, #ff4500);
            border-radius: 50%;
            transform: rotate(-25deg);
            filter: blur(2px);
            animation: gargantua-glow 3s infinite alternate ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes gargantua-glow {
            0% { filter: blur(2px); opacity: 0.8; }
            100% { filter: blur(4px); opacity: 1; box-shadow: 0 0 25px rgba(255, 165, 0, 0.9); }
        }

        /* Botão de Pausa centralizado na parte inferior */
        #pause-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 16, 33, 0.9);
            color: #60a5fa;
            border: 2px solid rgba(96, 165, 250, 0.5);
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease, opacity 1s ease;
        }

        #pause-btn:hover {
            background: #60a5fa;
            color: #0b1021;
            transform: translateX(-50%) scale(1.05);
        }

        /* Centralização do Sistema Solar */
        .solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            /* Transição muito mais longa e suave para a sucção */
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 4s ease-in;
        }

        /* O Sol Real */
        .sun {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 30% 30%, #fff700, #ff8c00, #ff0000);
            border-radius: 50%;
            position: absolute;
            z-index: 20;
            cursor: pointer;
            box-shadow: 0 0 45px rgba(255, 140, 0, 0.9), inset -6px -6px 15px rgba(0, 0, 0, 0.5);
            animation: pulse-sun 4s infinite alternate ease-in-out;
            transition: transform 0.3s ease;
        }

        @keyframes pulse-sun {
            0% { transform: scale(1); box-shadow: 0 0 35px rgba(255, 140, 0, 0.7); }
            100% { transform: scale(1.05); box-shadow: 0 0 60px rgba(255, 200, 0, 0.95); }
        }

        /* Linhas das Órbitas */
        .orbit {
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            pointer-events: none;
        }

        .mercury-orbit { width: 150px; height: 150px; animation: orbit-spin 3s linear infinite; }
        .venus-orbit    { width: 230px; height: 230px; animation: orbit-spin 6s linear infinite; }
        .earth-orbit    { width: 320px; height: 320px; animation: orbit-spin 10s linear infinite; }
        .mars-orbit     { width: 420px; height: 420px; animation: orbit-spin 16s linear infinite; }
        .jupiter-orbit  { width: 560px; height: 560px; animation: orbit-spin 25s linear infinite; }
        .saturn-orbit   { width: 700px; height: 700px; animation: orbit-spin 35s linear infinite; }
        .uranus-orbit   { width: 820px; height: 820px; animation: orbit-spin 48s linear infinite; }
        .neptune-orbit  { width: 940px; height: 940px; animation: orbit-spin 60s linear infinite; }

        .solar-system.paused .orbit {
            animation-play-state: paused !important;
        }

        /* Planetas */
        .planet {
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            z-index: 100;
            pointer-events: auto;
            transition: transform 0.3s ease;
        }

        .planet:hover, .sun:hover {
            transform: scale(1.5);
        }

        .mercury { width: 13px; height: 13px; top: -6.5px; background: radial-gradient(circle at 30% 30%, #e0e0e0, #737373); box-shadow: 0 0 8px rgba(180, 180, 180, 0.5); }
        .venus { width: 19px; height: 19px; top: -9.5px; background: radial-gradient(circle at 30% 30%, #fff2be, #c6934b); box-shadow: 0 0 10px rgba(227, 187, 118, 0.6); }
        .earth { width: 22px; height: 22px; top: -11px; background: radial-gradient(circle at 30% 30%, #60a5fa, #1e40af); box-shadow: 0 0 12px rgba(59, 130, 246, 0.8); }
        .mars { width: 17px; height: 17px; top: -8.5px; background: radial-gradient(circle at 30% 30%, #f87171, #991b1b); box-shadow: 0 0 10px rgba(220, 38, 38, 0.7); }
        .jupiter { width: 34px; height: 34px; top: -17px; background: linear-gradient(to bottom, #d97706 30%, #fef3c7 50%, #b45309 70%); box-shadow: 0 0 15px rgba(217, 119, 6, 0.8); }
        .saturn { width: 29px; height: 29px; top: -14.5px; background: radial-gradient(circle at 30% 30%, #fef08a, #ca8a04); box-shadow: 0 0 14px rgba(253, 224, 71, 0.7); }
        .uranus { width: 23px; height: 23px; top: -11.5px; background: radial-gradient(circle at 30% 30%, #7dd3fc, #0284c7); box-shadow: 0 0 12px rgba(56, 189, 248, 0.7); }
        .neptune { width: 22px; height: 22px; top: -11px; background: radial-gradient(circle at 30% 30%, #60a5fa, #1e3a8a); box-shadow: 0 0 12px rgba(29, 78, 216, 0.8); }

        .saturn-rings {
            position: absolute;
            top: -8px;
            left: -12px;
            width: 53px;
            height: 41px;
            border: 3px double rgba(253, 224, 71, 0.7);
            border-radius: 50%;
            transform: rotate(25deg);
            pointer-events: none;
        }

        @keyframes orbit-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Sucção suave e direcionada para o canto superior direito (Gargantua) */
        .solar-system.sucked {
            transform: translate(37vw, -42vh) scale(0.03) rotate(360deg) !important;
            opacity: 0;
        }

        /* --- Caixa de Informações (Modal) --- */
        #planet-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(11, 16, 33, 0.95);
            border: 2px solid rgba(96, 165, 250, 0.5);
            border-radius: 15px;
            padding: 25px;
            width: 320px;
            color: #ffffff;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(59, 130, 246, 0.4);
            z-index: 5000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease-in-out;
        }

        #planet-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        #planet-modal h2 {
            margin-top: 0;
            color: #60a5fa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
        }

        #planet-modal p {
            font-size: 14px;
            line-height: 1.5;
            margin: 8px 0;
        }

        #close-modal {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            float: right;
            transition: background 0.2s;
        }

        #close-modal:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <!-- Céu estrelado gerado via JavaScript -->
    <div id="starfield"></div>

    <!-- Buraco Negro Gargantua no canto superior direito -->
    <div id="gargantua" title="Gargantua (Buraco Negro)">
        <div class="gargantua-disk"></div>
        <div class="gargantua-hole"></div>
    </div>

    <!-- Botão de Pausa / Retomar na parte inferior central -->
    <button id="pause-btn">Pausar Órbitas ⏸️</button>

    <!-- Container do Sistema Solar -->
    <div class="solar-system">
        <!-- O Sol Real -->
        <div class="sun" data-planet="sun" title="Sol"></div>

        <!-- Órbitas e Planetas -->
        <div class="orbit mercury-orbit"><div class="planet mercury" data-planet="mercury" title="Mercúrio"></div></div>
        <div class="orbit venus-orbit"><div class="planet venus" data-planet="venus" title="Vênus"></div></div>
        <div class="orbit earth-orbit"><div class="planet earth" data-planet="earth" title="Terra"></div></div>
        <div class="orbit mars-orbit"><div class="planet mars" data-planet="mars" title="Marte"></div></div>
        <div class="orbit jupiter-orbit"><div class="planet jupiter" data-planet="jupiter" title="Júpiter"></div></div>
        <div class="orbit saturn-orbit"><div class="planet saturn" data-planet="saturn" title="Saturno"><div class="saturn-rings"></div></div></div>
        <div class="orbit uranus-orbit"><div class="planet uranus" data-planet="uranus" title="Urano"></div></div>
        <div class="orbit neptune-orbit"><div class="planet neptune" data-planet="neptune" title="Netuno"></div></div>
    </div>

    <!-- Caixa Modal de Informações Detalhadas -->
    <div id="planet-modal">
        <h2><span id="modal-icon"></span> <span id="modal-title">Título</span></h2>
        <p><strong>Distância do Sol:</strong> <span id="modal-distance"></span></p>
        <p><strong>Massa:</strong> <span id="modal-mass"></span></p>
        <p id="modal-desc"></p>
        <button id="close-modal">Fechar</button>
    </div>

    <script>
        // 1. Geração automática de fundo estrelado cintilante
        const starfield = document.getElementById('starfield');
        const numberOfStars = 150;

        for (let i = 0; i < numberOfStars; i++) {
            const star = document.createElement('div');
            star.classList.add('bg-star');

            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const size = Math.random() * 2.5 + 0.5;
            const duration = Math.random() * 2 + 1;
            const delay = Math.random() * 2;

            star.style.left = `${x}vw`;
            star.style.top = `${y}vh`;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.animationDuration = `${duration}s`;
            star.style.animationDelay = `${delay}s`;

            starfield.appendChild(star);
        }

        // 2. Banco de dados com ícones corretos para cada astro
        const planetData = {
            sun: {
                icon: "☀️",
                title: "O Sol",
                distance: "0 km (Centro)",
                mass: "333.000 massas terrestres",
                desc: "Estrela tipo G da sequência principal, o Sol contém 99,8% de toda a massa do Sistema Solar e gera energia através de fusão nuclear."
            },
            mercury: {
                icon: "🪨",
                title: "Mercúrio",
                distance: "57,9 milhões de km",
                mass: "3,30 × 10²³ kg",
                desc: "O menor planeta do Sistema Solar e o mais próximo do Sol. Sua superfície sofre variações extremas de temperatura."
            },
            venus: {
                icon: "🟠",
                title: "Vênus",
                distance: "108,2 milhões de km",
                mass: "4,87 × 10²⁴ kg",
                desc: "O planeta mais quente do sistema devido a um efeito estufa descontrolado causado por sua atmosfera espessa de dióxido de carbono."
            },
            earth: {
                icon: "🌍",
                title: "Terra",
                distance: "149,6 milhões de km",
                mass: "5,97 × 10²⁴ kg",
                desc: "Nosso planeta natal, o único conhecido por abrigar vida, com 71% de sua superfície coberta por água líquida."
            },
            mars: {
                icon: "🔴",
                title: "Marte",
                distance: "227,9 milhões de km",
                mass: "6,42 × 10²³ kg",
                desc: "Conhecido como o Planeta Vermelho devido ao óxido de ferro em sua superfície. Possui o maior vulcão do sistema solar, o Monte Olimpo."
            },
            jupiter: {
                icon: "🪐",
                title: "Júpiter",
                distance: "778,5 milhões de km",
                mass: "1,90 × 10²⁷ kg",
                desc: "O maior planeta do Sistema Solar, um gigante gasoso famoso por sua Grande Mancha Vermelha e dezenas de luas."
            },
            saturn: {
                icon: "🪐",
                title: "Saturno",
                distance: "1,43 bilhão de km",
                mass: "5,68 × 10²⁶ kg",
                desc: "Famoso por seu espetacular e complexo sistema de anéis formados predominantemente por partículas de gelo e rocha."
            },
            uranus: {
                icon: "🔵",
                title: "Urano",
                distance: "2,87 bilhões de km",
                mass: "8,68 × 10²⁵ kg",
                desc: "Um gigante de gelo que possui uma inclinação axial única, fazendo com que praticamente 'gire de lado' em sua órbita."
            },
            neptune: {
                icon: "🔷",
                title: "Netuno",
                distance: "4,50 bilhões de km",
                mass: "1,02 × 10²⁶ kg",
                desc: "O planeta mais distante do Sol na lista tradicional, conhecido por seus ventos supersônicos extremamente violentos e coloração azul viva."
            }
        };

        // 3. Controle do Modal e Cliques
        const modal = document.getElementById('planet-modal');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalDistance = document.getElementById('modal-distance');
        const modalMass = document.getElementById('modal-mass');
        const modalDesc = document.getElementById('modal-desc');
        const closeModalBtn = document.getElementById('close-modal');
        const astros = document.querySelectorAll('.sun, .planet');

        astros.forEach(astro => {
            astro.addEventListener('click', (e) => {
                e.stopPropagation();
                const key = astro.getAttribute('data-planet');
                const data = planetData[key];

                if (data) {
                    modalIcon.innerText = data.icon;
                    modalTitle.innerText = data.title;
                    modalDistance.innerText = data.distance;
                    modalMass.innerText = data.mass;
                    modalDesc.innerText = data.desc;
                    modal.classList.add('active');
                }
            });
        });

        closeModalBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        window.addEventListener('click', (e) => {
            if (!modal.contains(e.target) && !e.target.classList.contains('planet') && !e.target.classList.contains('sun')) {
                modal.classList.remove('active');
            }
        });

        // 4. Lógica do Botão de Pausa
        const pauseBtn = document.getElementById('pause-btn');
        const solarSystem = document.querySelector('.solar-system');
        let isPaused = false;

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            solarSystem.classList.toggle('paused', isPaused);
            pauseBtn.innerText = isPaused ? "Retomar Órbitas ▶️" : "Pausar Órbitas ⏸️";
        });

        // 5. Lógica do Gargantua (Sucção mais suave e elegante)
        const gargantua = document.getElementById('gargantua');

        gargantua.addEventListener('click', () => {
            solarSystem.classList.add('sucked');
            starfield.style.opacity = '0';
            document.body.style.background = '#000000';
            
            pauseBtn.style.opacity = '0';
            pauseBtn.style.pointerEvents = 'none';
            
            modal.classList.remove('active');
        });
    </script>
</body>
</html>
