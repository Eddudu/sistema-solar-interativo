<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solar Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Céu estrelado gerado via JavaScript -->
    <div id="starfield"></div>

    <!-- Buraco Negro Gargantua no canto superior direito -->
    <div id="gargantua" title="Gargantua (Buraco Negro)" role="button" aria-label="Buraco negro Gargantua">
        <div class="gargantua-disk"></div>
        <div class="gargantua-hole"></div>
    </div>

    <!-- Botão de Pausa / Retomar -->
    <button id="pause-btn" aria-label="Pausar ou retomar órbitas">Pausar Órbitas ⏸️</button>

    <!-- Botão de Reiniciar (aparece após a sucção) -->
    <button id="reset-btn" aria-label="Reiniciar sistema solar">Reiniciar Sistema Solar 🔄</button>

    <!-- Sistema Solar -->
    <div class="solar-system">
        <div class="sun" data-planet="sun" title="Sol" aria-label="Sol"></div>

        <div class="orbit mercury-orbit"><div class="planet mercury" data-planet="mercury" title="Mercúrio" aria-label="Mercúrio"></div></div>
        <div class="orbit venus-orbit"><div class="planet venus" data-planet="venus" title="Vênus" aria-label="Vênus"></div></div>
        <div class="orbit earth-orbit"><div class="planet earth" data-planet="earth" title="Terra" aria-label="Terra"></div></div>
        <div class="orbit mars-orbit"><div class="planet mars" data-planet="mars" title="Marte" aria-label="Marte"></div></div>
        <div class="orbit jupiter-orbit"><div class="planet jupiter" data-planet="jupiter" title="Júpiter" aria-label="Júpiter"></div></div>
        <div class="orbit saturn-orbit"><div class="planet saturn" data-planet="saturn" title="Saturno" aria-label="Saturno"><div class="saturn-rings"></div></div></div>
        <div class="orbit uranus-orbit"><div class="planet uranus" data-planet="uranus" title="Urano" aria-label="Urano"></div></div>
        <div class="orbit neptune-orbit"><div class="planet neptune" data-planet="neptune" title="Netuno" aria-label="Netuno"></div></div>
    </div>

    <!-- Modal de informações -->
    <div id="planet-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2><span id="modal-icon"></span> <span id="modal-title">Título</span></h2>
        <p><strong>Distância do Sol:</strong> <span id="modal-distance"></span></p>
        <p><strong>Massa:</strong> <span id="modal-mass"></span></p>
        <p id="modal-desc"></p>
        <button id="close-modal" aria-label="Fechar janela de informações">Fechar</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
